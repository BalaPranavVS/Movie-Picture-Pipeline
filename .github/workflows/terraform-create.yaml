name: Terraform Infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  terraform:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: setup/terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.3.9

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}


      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Validate
        run: terraform validate

      - name: Import existing ECR frontend
        run: |
          if ! terraform state show aws_ecr_repository.frontend >/dev/null 2>&1; then
            terraform import aws_ecr_repository.frontend frontend
          else
            echo "Frontend ECR already exists in Terraform state"
          fi

      - name: Import existing ECR backend
        run: |
          if ! terraform state show aws_ecr_repository.backend >/dev/null 2>&1; then
            terraform import aws_ecr_repository.backend backend
          else
            echo "Backend ECR already exists in Terraform state"
          fi

      - name: Import existing EKS cluster IAM role
        run: |
          if ! terraform state show aws_iam_role.eks_cluster >/dev/null 2>&1; then
            terraform import aws_iam_role.eks_cluster eks_cluster_role
          else
            echo "EKS cluster IAM role already exists in Terraform state"
          fi

      - name: Import existing node group IAM role
        run: |
          if ! terraform state show aws_iam_role.node_group >/dev/null 2>&1; then
            terraform import aws_iam_role.node_group udacity-node-group
          else
            echo "Node group IAM role already exists in Terraform state"
          fi

      - name: Import existing CodeBuild IAM role
        run: |
          if ! terraform state show aws_iam_role.codebuild >/dev/null 2>&1; then
            terraform import aws_iam_role.codebuild codebuild-role
          else
            echo "CodeBuild IAM role already exists in Terraform state"
          fi

      - name: Import existing GitHub Actions IAM user
        run: |
          if ! terraform state show aws_iam_user.github_action_user >/dev/null 2>&1; then
            terraform import aws_iam_user.github_action_user github-action-user
          else
            echo "GitHub Actions IAM user already exists in Terraform state"
          fi

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Terraform Outputs
        run: terraform output
