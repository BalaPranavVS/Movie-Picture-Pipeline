name: Terraform Blue-Green Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  TF_ACTION_WORKING_DIR: setup/terraform
  AWS_REGION: us-east-1

jobs:
  terraform:
    name: Create / Update Infrastructure
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_ACTION_WORKING_DIR }}

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. Install Terraform
      # ---------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.3.9


      # ---------------------------------------------------------
      # 3. Configure AWS credentials
      # ---------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}


      # ---------------------------------------------------------
      # 4. Verify AWS credentials
      # ---------------------------------------------------------
      - name: Verify AWS credentials
        run: |
          echo "Checking AWS identity..."
          aws sts get-caller-identity

          echo "AWS_REGION=$AWS_REGION"


      # ---------------------------------------------------------
      # 5. Terraform Init
      # ---------------------------------------------------------
      - name: Terraform Init
        run: terraform init -upgrade


      # ---------------------------------------------------------
      # 6. Terraform Validate
      # ---------------------------------------------------------
      - name: Terraform Validate
        run: terraform validate


      # ---------------------------------------------------------
      # 7. Import existing ECR repositories
      # ---------------------------------------------------------
      - name: Import existing ECR repositories
        run: |
          echo "Checking frontend ECR repository..."

          if aws ecr describe-repositories \
            --repository-names frontend \
            --region "$AWS_REGION" >/dev/null 2>&1; then

            if ! terraform state show aws_ecr_repository.frontend >/dev/null 2>&1; then
              terraform import aws_ecr_repository.frontend frontend
            else
              echo "frontend ECR already in Terraform state"
            fi

          else
            echo "frontend ECR repository does not exist"
          fi


          echo "Checking backend ECR repository..."

          if aws ecr describe-repositories \
            --repository-names backend \
            --region "$AWS_REGION" >/dev/null 2>&1; then

            if ! terraform state show aws_ecr_repository.backend >/dev/null 2>&1; then
              terraform import aws_ecr_repository.backend backend
            else
              echo "backend ECR already in Terraform state"
            fi

          else
            echo "backend ECR repository does not exist"
          fi


      # ---------------------------------------------------------
      # 8. Import existing EKS cluster
      # ---------------------------------------------------------
      - name: Import existing EKS cluster
        run: |
          echo "Checking EKS cluster..."

          if aws eks describe-cluster \
            --name cluster \
            --region "$AWS_REGION" >/dev/null 2>&1; then

            if ! terraform state show aws_eks_cluster.main >/dev/null 2>&1; then
              terraform import aws_eks_cluster.main cluster
            else
              echo "EKS cluster already in Terraform state"
            fi

          else
            echo "EKS cluster does not exist"
          fi


      # ---------------------------------------------------------
      # 9. Import existing EKS node group
      # ---------------------------------------------------------
      - name: Import existing EKS node group
        run: |
          echo "Checking EKS node group..."

          if aws eks describe-nodegroup \
            --cluster-name cluster \
            --nodegroup-name udacity \
            --region "$AWS_REGION" >/dev/null 2>&1; then

            if ! terraform state show aws_eks_node_group.main >/dev/null 2>&1; then
              terraform import aws_eks_node_group.main cluster:udacity
            else
              echo "EKS node group already in Terraform state"
            fi

          else
            echo "EKS node group does not exist"
          fi


      # ---------------------------------------------------------
      # 10. Import existing EKS cluster IAM role
      # ---------------------------------------------------------
      - name: Import EKS cluster IAM role
        run: |
          if aws iam get-role \
            --role-name eks_cluster_role >/dev/null 2>&1; then

            if ! terraform state show aws_iam_role.eks_cluster >/dev/null 2>&1; then
              terraform import aws_iam_role.eks_cluster eks_cluster_role
            else
              echo "eks_cluster_role already in Terraform state"
            fi

          else
            echo "eks_cluster_role does not exist"
          fi


      # ---------------------------------------------------------
      # 11. Import existing node group IAM role
      # ---------------------------------------------------------
      - name: Import node group IAM role
        run: |
          if aws iam get-role \
            --role-name udacity-node-group >/dev/null 2>&1; then

            if ! terraform state show aws_iam_role.node_group >/dev/null 2>&1; then
              terraform import aws_iam_role.node_group udacity-node-group
            else
              echo "udacity-node-group already in Terraform state"
            fi

          else
            echo "udacity-node-group does not exist"
          fi


      # ---------------------------------------------------------
      # 12. Import existing GitHub Action IAM user
      # ---------------------------------------------------------
      - name: Import GitHub Action IAM user
        run: |
          if aws iam get-user \
            --user-name github-action-user >/dev/null 2>&1; then

            if ! terraform state show aws_iam_user.github_action_user >/dev/null 2>&1; then
              terraform import aws_iam_user.github_action_user github-action-user
            else
              echo "github-action-user already in Terraform state"
            fi

          else
            echo "github-action-user does not exist"
          fi


      # ---------------------------------------------------------
      # 13. Import existing VPC
      # ---------------------------------------------------------
      - name: Import existing VPC
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=udacity" \
            --query "Vpcs[0].VpcId" \
            --output text \
            --region "$AWS_REGION")

          if [ "$VPC_ID" != "None" ] && [ -n "$VPC_ID" ]; then

            echo "Found VPC: $VPC_ID"

            if ! terraform state show aws_vpc.vpc >/dev/null 2>&1; then
              terraform import aws_vpc.vpc "$VPC_ID"
            else
              echo "VPC already in Terraform state"
            fi

          else
            echo "No VPC with Name=udacity found"
          fi


      # ---------------------------------------------------------
      # 14. Import networking resources
      # ---------------------------------------------------------
      - name: Import networking resources
        shell: bash
        run: |

          set -e

          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=udacity" \
            --query "Vpcs[0].VpcId" \
            --output text \
            --region "$AWS_REGION")

          if [ "$VPC_ID" == "None" ] || [ -z "$VPC_ID" ]; then
            echo "No VPC found, skipping networking import"
            exit 0
          fi

          echo "Using VPC: $VPC_ID"


          # =====================================================
          # PUBLIC SUBNET
          # =====================================================

          PUBLIC_SUBNET_ID=$(aws ec2 describe-subnets \
            --filters \
              "Name=vpc-id,Values=$VPC_ID" \
              "Name=cidr-block,Values=10.0.1.0/24" \
            --query "Subnets[0].SubnetId" \
            --output text \
            --region "$AWS_REGION")

          if [ "$PUBLIC_SUBNET_ID" != "None" ] && \
             [ -n "$PUBLIC_SUBNET_ID" ]; then

            echo "Public subnet: $PUBLIC_SUBNET_ID"

            if ! terraform state show aws_subnet.public_subnet >/dev/null 2>&1; then
              terraform import aws_subnet.public_subnet "$PUBLIC_SUBNET_ID"
            else
              echo "public_subnet already in Terraform state"
            fi

          else
            echo "No public subnet found"
          fi


          # =====================================================
          # PRIVATE SUBNET
          # =====================================================

          PRIVATE_SUBNET_ID=$(aws ec2 describe-subnets \
            --filters \
              "Name=vpc-id,Values=$VPC_ID" \
              "Name=cidr-block,Values=10.0.2.0/24" \
            --query "Subnets[0].SubnetId" \
            --output text \
            --region "$AWS_REGION")

          if [ "$PRIVATE_SUBNET_ID" != "None" ] && \
             [ -n "$PRIVATE_SUBNET_ID" ]; then

            echo "Private subnet: $PRIVATE_SUBNET_ID"

            if ! terraform state show aws_subnet.private_subnet >/dev/null 2>&1; then
              terraform import aws_subnet.private_subnet "$PRIVATE_SUBNET_ID"
            else
              echo "private_subnet already in Terraform state"
            fi

          else
            echo "No private subnet found"
          fi


          # =====================================================
          # INTERNET GATEWAY
          # =====================================================

          IGW_ID=$(aws ec2 describe-internet-gateways \
            --filters "Name=attachment.vpc-id,Values=$VPC_ID" \
            --query "InternetGateways[0].InternetGatewayId" \
            --output text \
            --region "$AWS_REGION")

          if [ "$IGW_ID" != "None" ] && [ -n "$IGW_ID" ]; then

            echo "Internet Gateway: $IGW_ID"

            if ! terraform state show aws_internet_gateway.igw >/dev/null 2>&1; then
              terraform import aws_internet_gateway.igw "$IGW_ID"
            else
              echo "igw already in Terraform state"
            fi

          else
            echo "No internet gateway found"
          fi


          # =====================================================
          # PUBLIC ROUTE TABLE
          # =====================================================

          PUBLIC_RTB_ID=$(aws ec2 describe-route-tables \
            --filters \
              "Name=vpc-id,Values=$VPC_ID" \
              "Name=tag:Name,Values=public" \
            --query "RouteTables[0].RouteTableId" \
            --output text \
            --region "$AWS_REGION")

          if [ "$PUBLIC_RTB_ID" != "None" ] && [ -n "$PUBLIC_RTB_ID" ]; then

            echo "Public route table: $PUBLIC_RTB_ID"

            if ! terraform state show aws_route_table.public >/dev/null 2>&1; then
              terraform import aws_route_table.public "$PUBLIC_RTB_ID"
            else
              echo "public route table already in Terraform state"
            fi

          else
            echo "No public route table found"
          fi


          # =====================================================
          # PUBLIC ROUTE TABLE ASSOCIATION
          # =====================================================

          if [ "$PUBLIC_SUBNET_ID" != "None" ] && \
             [ -n "$PUBLIC_SUBNET_ID" ] && \
             [ "$PUBLIC_RTB_ID" != "None" ] && \
             [ -n "$PUBLIC_RTB_ID" ]; then

            PUBLIC_ASSOC_ID=$(aws ec2 describe-route-tables \
              --region "$AWS_REGION" \
              --query "RouteTables[].Associations[?SubnetId=='$PUBLIC_SUBNET_ID'].RouteTableAssociationId | [0]" \
              --output text)

            echo "Public association: $PUBLIC_ASSOC_ID"

            if [ "$PUBLIC_ASSOC_ID" != "None" ] && \
               [ -n "$PUBLIC_ASSOC_ID" ]; then

              if ! terraform state show aws_route_table_association.public >/dev/null 2>&1; then

                terraform import \
                  aws_route_table_association.public \
                  "$PUBLIC_ASSOC_ID"

              else

                echo "public route table association already in Terraform state"

              fi

            else
              echo "No public subnet association found"
            fi

          fi


          # =====================================================
          # PRIVATE ROUTE TABLE
          # =====================================================

          PRIVATE_RTB_ID=$(aws ec2 describe-route-tables \
            --filters \
              "Name=vpc-id,Values=$VPC_ID" \
              "Name=tag:Name,Values=private" \
            --query "RouteTables[0].RouteTableId" \
            --output text \
            --region "$AWS_REGION")

          if [ "$PRIVATE_RTB_ID" != "None" ] && \
             [ -n "$PRIVATE_RTB_ID" ]; then

            echo "Private route table: $PRIVATE_RTB_ID"

            if ! terraform state show aws_route_table.private >/dev/null 2>&1; then
              terraform import aws_route_table.private "$PRIVATE_RTB_ID"
            else
              echo "private route table already in Terraform state"
            fi

          else
            echo "No private route table found"
          fi


          # =====================================================
          # PRIVATE ROUTE TABLE ASSOCIATION
          #
          # IMPORTANT:
          # Find the existing association by PRIVATE SUBNET
          # across ALL route tables.
          # =====================================================

          if [ "$PRIVATE_SUBNET_ID" != "None" ] && \
             [ -n "$PRIVATE_SUBNET_ID" ]; then

            echo "Searching for existing private subnet association..."

            PRIVATE_ASSOC_ID=$(aws ec2 describe-route-tables \
              --region "$AWS_REGION" \
              --query "RouteTables[].Associations[?SubnetId=='$PRIVATE_SUBNET_ID'].RouteTableAssociationId | [0]" \
              --output text)

            CURRENT_PRIVATE_RTB_ID=$(aws ec2 describe-route-tables \
              --region "$AWS_REGION" \
              --query "RouteTables[?Associations[?SubnetId=='$PRIVATE_SUBNET_ID']].RouteTableId | [0]" \
              --output text)

            echo "Private subnet: $PRIVATE_SUBNET_ID"
            echo "Current association: $PRIVATE_ASSOC_ID"
            echo "Current route table: $CURRENT_PRIVATE_RTB_ID"
            echo "Terraform private route table: $PRIVATE_RTB_ID"


            # ---------------------------------------------------
            # Existing association found
            # ---------------------------------------------------

            if [ "$PRIVATE_ASSOC_ID" != "None" ] && \
               [ -n "$PRIVATE_ASSOC_ID" ]; then

              if ! terraform state show aws_route_table_association.private >/dev/null 2>&1; then

                echo "Importing existing private subnet association..."

                terraform import \
                  aws_route_table_association.private \
                  "$PRIVATE_ASSOC_ID"

              else

                echo "private route table association already in Terraform state"

              fi


            # ---------------------------------------------------
            # No existing association
            # ---------------------------------------------------

            else

              echo "No existing private subnet association found."

            fi

          fi


      # ---------------------------------------------------------
      # 15. Import existing EKS add-ons
      # ---------------------------------------------------------
      - name: Import existing EKS add-ons
        shell: bash
        run: |

          set -e

          echo "Checking EKS add-ons..."


          # =====================================================
          # VPC CNI
          # =====================================================

          if aws eks describe-addon \
            --cluster-name cluster \
            --addon-name vpc-cni \
            --region "$AWS_REGION" >/dev/null 2>&1; then

            echo "vpc-cni exists"

            if ! terraform state show aws_eks_addon.vpc_cni >/dev/null 2>&1; then

              terraform import \
                aws_eks_addon.vpc_cni \
                "cluster:vpc-cni"

            else

              echo "vpc-cni already in Terraform state"

            fi

          else

            echo "vpc-cni does not exist"

          fi


          # =====================================================
          # KUBE PROXY
          # =====================================================

          if aws eks describe-addon \
            --cluster-name cluster \
            --addon-name kube-proxy \
            --region "$AWS_REGION" >/dev/null 2>&1; then

            echo "kube-proxy exists"

            if ! terraform state show aws_eks_addon.kube_proxy >/dev/null 2>&1; then

              terraform import \
                aws_eks_addon.kube_proxy \
                "cluster:kube-proxy"

            else

              echo "kube-proxy already in Terraform state"

            fi

          else

            echo "kube-proxy does not exist"

          fi


          # =====================================================
          # COREDNS
          # =====================================================

          if aws eks describe-addon \
            --cluster-name cluster \
            --addon-name coredns \
            --region "$AWS_REGION" >/dev/null 2>&1; then

            echo "coredns exists"

            if ! terraform state show aws_eks_addon.coredns >/dev/null 2>&1; then

              terraform import \
                aws_eks_addon.coredns \
                "cluster:coredns"

            else

              echo "coredns already in Terraform state"

            fi

          else

            echo "coredns does not exist"

          fi


      # ---------------------------------------------------------
      # 16. Show Terraform state
      # ---------------------------------------------------------
      - name: Terraform State
        run: |
          echo "========== TERRAFORM STATE =========="
          terraform state list
          echo "====================================="


      # ---------------------------------------------------------
      # 17. Terraform Plan
      # ---------------------------------------------------------
      - name: Terraform Plan
        run: terraform plan


      # ---------------------------------------------------------
      # 18. Terraform Apply
      # ---------------------------------------------------------
      - name: Terraform Apply
        run: terraform apply -auto-approve
