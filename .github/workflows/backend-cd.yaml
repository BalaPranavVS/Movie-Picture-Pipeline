name: Backend CD

on:
  push:
    branches:
      - main
    paths:
      - "starter/backend/**"
      - ".github/workflows/backend-cd.yaml"

  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  ECR_REPOSITORY: ${{ secrets.ECR_BACKEND_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:

  lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pipenv
        run: |
          python -m pip install --upgrade pip
          pip install pipenv

      - name: Install dependencies
        run: |
          pipenv install --dev

      - name: Run lint
        run: |
          pipenv run lint


  test:
    name: Backend Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pipenv
        run: |
          python -m pip install --upgrade pip
          pip install pipenv

      - name: Install dependencies
        run: |
          pipenv install --dev

      - name: Run tests
        run: |
          pipenv run test


  build:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: starter/backend
        run: |
          docker build \
            -t "$ECR_REPOSITORY:$IMAGE_TAG" \
            .

      - name: Push Docker image
        run: |
          docker push "$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Show image
        run: |
          echo "Backend image:"
          echo "$ECR_REPOSITORY:$IMAGE_TAG"


  deploy:
    name: Deploy Backend to EKS
    runs-on: ubuntu-latest

    needs:
      - build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Verify EKS cluster
        run: |
          kubectl get nodes

      - name: Install Kustomize
        run: |
          curl -s \
            https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh \
            | bash

          sudo mv kustomize /usr/local/bin/kustomize

          kustomize version

      - name: Deploy backend
        working-directory: starter/backend/k8s
        run: |
          echo "Setting backend image..."

          kustomize edit set image \
            backend="$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Applying backend Kubernetes manifests..."

          kustomize build | kubectl apply -f -

      - name: Wait for backend deployment
        run: |
          kubectl rollout status deployment/backend \
            --timeout=5m

      - name: Show backend resources
        run: |
          echo "=========================================="
          echo "Backend Kubernetes Resources"
          echo "=========================================="

          kubectl get deployment backend
          kubectl get pods -l app=backend
          kubectl get svc backend

      - name: Wait for backend LoadBalancer
        id: backend-url
        run: |
          echo "Waiting for backend LoadBalancer..."

          for i in {1..30}; do

            BACKEND_HOSTNAME=$(kubectl get svc backend \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
              2>/dev/null || true)

            BACKEND_IP=$(kubectl get svc backend \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' \
              2>/dev/null || true)

            if [ -n "$BACKEND_HOSTNAME" ]; then
              echo "Backend LoadBalancer hostname:"
              echo "$BACKEND_HOSTNAME"

              echo "url=http://$BACKEND_HOSTNAME" >> "$GITHUB_OUTPUT"

              break
            fi

            if [ -n "$BACKEND_IP" ]; then
              echo "Backend LoadBalancer IP:"
              echo "$BACKEND_IP"

              echo "url=http://$BACKEND_IP" >> "$GITHUB_OUTPUT"

              break
            fi

            echo "Backend LoadBalancer not ready..."
            echo "Waiting 10 seconds..."

            sleep 10
          done

          if [ -z "$BACKEND_HOSTNAME" ] && [ -z "$BACKEND_IP" ]; then
            echo "ERROR: Backend LoadBalancer was not created."

            kubectl get svc backend -o wide

            exit 1
          fi

      - name: Print backend URL
        run: |
          echo ""
          echo "=========================================="
          echo "       BACKEND DEPLOYMENT SUCCESS"
          echo "=========================================="
          echo ""
          echo "Backend URL:"
          echo "${{ steps.backend-url.outputs.url }}"
          echo ""
          echo "=========================================="
