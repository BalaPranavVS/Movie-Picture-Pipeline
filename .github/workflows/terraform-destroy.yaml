name: Terraform Destroy

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  terraform-destroy:
    name: Destroy AWS Infrastructure
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: setup/terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.3.9

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: terraform init -upgrade

      - name: Terraform Validate
        run: terraform validate

      # Import existing resources so Terraform knows about
      # resources that were created before the current state.

      - name: Import VPC
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=udacity-vpc" \
            --query "Vpcs[0].VpcId" \
            --output text)

          if [ "$VPC_ID" != "None" ] && [ -n "$VPC_ID" ]; then
            if ! terraform state show aws_vpc.vpc >/dev/null 2>&1; then
              terraform import aws_vpc.vpc "$VPC_ID"
            else
              echo "VPC already in Terraform state"
            fi
          else
            echo "No VPC with tag Name=udacity-vpc found"
          fi

      - name: Import ECR frontend
        run: |
          if aws ecr describe-repositories \
            --repository-names frontend >/dev/null 2>&1; then

            if ! terraform state show aws_ecr_repository.frontend >/dev/null 2>&1; then
              terraform import aws_ecr_repository.frontend frontend
            else
              echo "Frontend ECR already in Terraform state"
            fi
          else
            echo "Frontend ECR does not exist"
          fi

      - name: Import ECR backend
        run: |
          if aws ecr describe-repositories \
            --repository-names backend >/dev/null 2>&1; then

            if ! terraform state show aws_ecr_repository.backend >/dev/null 2>&1; then
              terraform import aws_ecr_repository.backend backend
            else
              echo "Backend ECR already in Terraform state"
            fi
          else
            echo "Backend ECR does not exist"
          fi

      - name: Import EKS cluster
        run: |
          if aws eks describe-cluster \
            --name cluster >/dev/null 2>&1; then

            if ! terraform state show aws_eks_cluster.main >/dev/null 2>&1; then
              terraform import aws_eks_cluster.main cluster
            else
              echo "EKS cluster already in Terraform state"
            fi
          else
            echo "EKS cluster does not exist"
          fi

      - name: Import EKS node group
        run: |
          if aws eks describe-nodegroup \
            --cluster-name cluster \
            --nodegroup-name udacity >/dev/null 2>&1; then

            if ! terraform state show aws_eks_node_group.main >/dev/null 2>&1; then
              terraform import aws_eks_node_group.main cluster:udacity
            else
              echo "EKS node group already in Terraform state"
            fi
          else
            echo "EKS node group does not exist"
          fi

      - name: Import EKS cluster IAM role
        run: |
          if aws iam get-role \
            --role-name eks_cluster_role >/dev/null 2>&1; then

            if ! terraform state show aws_iam_role.eks_cluster >/dev/null 2>&1; then
              terraform import aws_iam_role.eks_cluster eks_cluster_role
            else
              echo "EKS cluster IAM role already in Terraform state"
            fi
          else
            echo "EKS cluster IAM role does not exist"
          fi

      - name: Import node group IAM role
        run: |
          if aws iam get-role \
            --role-name udacity-node-group >/dev/null 2>&1; then

            if ! terraform state show aws_iam_role.node_group >/dev/null 2>&1; then
              terraform import aws_iam_role.node_group udacity-node-group
            else
              echo "Node group IAM role already in Terraform state"
            fi
          else
            echo "Node group IAM role does not exist"
          fi

      - name: Show Terraform state
        run: terraform state list

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
