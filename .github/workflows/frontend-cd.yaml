name: Frontend CD

on:
  push:
    branches:
      - main
    paths:
      - "starter/frontend/**"
      - ".github/workflows/frontend-cd.yaml"

  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  ECR_REPOSITORY: ${{ secrets.ECR_FRONTEND_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint:
    name: Frontend Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    name: Frontend Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false

  build:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # CHANGED:
      # Backend URL now comes from GitHub Repository Variable
      - name: Get backend LoadBalancer URL
        id: backend-url
        run: |
          if [ -z "${{ vars.BACKEND_API_URL }}" ]; then
            echo "ERROR: BACKEND_API_URL GitHub repository variable is not set."
            exit 1
          fi

          echo "Backend API URL is configured."
          echo "url=${{ vars.BACKEND_API_URL }}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        working-directory: starter/frontend
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="${{ steps.backend-url.outputs.url }}" \
            -t "$ECR_REPOSITORY:$IMAGE_TAG" \
            .

      - name: Push Docker image
        run: |
          docker push "$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Show image
        run: |
          echo "Frontend image:"
          echo "$ECR_REPOSITORY:$IMAGE_TAG"

  deploy:
    name: Deploy Frontend to EKS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Verify EKS cluster
        run: |
          kubectl get nodes
          kubectl get svc -A

      - name: Install Kustomize
        run: |
          curl -s \
            https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh \
            | bash

          sudo mv kustomize /usr/local/bin/kustomize

          kustomize version

      - name: Deploy frontend
        working-directory: starter/frontend/k8s
        run: |
          echo "Setting frontend image..."

          kustomize edit set image \
            frontend="$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Applying frontend Kubernetes manifests..."

          kustomize build | kubectl apply -f -

      - name: Wait for frontend deployment
        run: |
          kubectl rollout status deployment/frontend \
            --timeout=5m

      - name: Show frontend resources
        run: |
          echo "=========================================="
          echo "Frontend Kubernetes Resources"
          echo "=========================================="

          kubectl get deployment frontend
          kubectl get pods -l app=frontend
          kubectl get svc frontend

      - name: Wait for frontend LoadBalancer
        id: frontend-url
        run: |
          echo "Waiting for frontend LoadBalancer..."

          for i in {1..30}; do
            FRONTEND_HOSTNAME=$(kubectl get svc frontend \
              --namespace default \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)

            FRONTEND_IP=$(kubectl get svc frontend \
              --namespace default \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)

            if [ -n "$FRONTEND_HOSTNAME" ]; then
              echo "Frontend LoadBalancer hostname:"
              echo "$FRONTEND_HOSTNAME"

              echo "url=http://$FRONTEND_HOSTNAME" >> "$GITHUB_OUTPUT"
              break
            fi

            if [ -n "$FRONTEND_IP" ]; then
              echo "Frontend LoadBalancer IP:"
              echo "$FRONTEND_IP"

              echo "url=http://$FRONTEND_IP" >> "$GITHUB_OUTPUT"
              break
            fi

            echo "Frontend LoadBalancer not ready. Waiting..."
            sleep 10
          done

          if [ -z "$FRONTEND_HOSTNAME" ] && [ -z "$FRONTEND_IP" ]; then
            echo "ERROR: Frontend LoadBalancer was not created."
            kubectl get svc frontend -o wide
            exit 1
          fi

      - name: Print application URL
        run: |
          echo ""
          echo "=========================================="
          echo "       MOVIE PICTURE PIPELINE"
          echo "=========================================="
          echo ""
          echo "Frontend URL:"
          echo "${{ steps.frontend-url.outputs.url }}"
          echo ""
          echo "=========================================="
