name: Fix Backend Pipfile.lock

on:
  workflow_dispatch:

jobs:
  relock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: starter/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pipenv
        run: pip install pipenv

      - name: Regenerate Pipfile.lock
        run: pipenv lock

      - name: Commit and push updated lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Pipfile.lock
          if git diff --cached --quiet; then
            echo "Pipfile.lock already up to date, nothing to commit."
          else
            git commit -m "chore: regenerate Pipfile.lock"
            git push
          fi
